baseURL: https://example.com
title: Hugo blog
theme: izi-hugo-theme

# Default content language, support: en-gb (English), en-us (American English)
defaultContentLanguage: en-gb
locale: en-GB

# !!! exampleSite ONLY, DELETE THIS LINE FOR YOUR OWN USE: `themesDir: ../../`
themesDir: ../../

security:
  # To allow appending raw CSS/JS into specific content pages, see exampleSite/content/posts/placeholder-text.md
  # In terms of security, as long as you trust the author(s) of the content itself, it's safe to enable
  enableInlineShortcodes: true

# Number of posts on the index page
pagination:
  pagerSize: 10

services:
  googleAnalytics:
    id: G-MEASUREMENT_ID

# Hugo Configure Markup
# More info: https://gohugo.io/getting-started/configuration-markup#
markup:
  highlight:
    # but you can also be speciffic by specifying the language when opening the blog, for example: ```java
    guessSyntax: true
    # makes it use CSS clases so colours can be adapted with CSS, for example for dark themes
    noClasses: false
  # needed to render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
  goldmark:
    renderer:
      # Allows raw HTML in Markdown content. As long as you trust the author(s) of the content itself, it's safe to enable
      unsafe: true

# Site parameters
params:
  author:
    name: Your Name
    email: firstname.lastname@example.com

  # Website copyright, default: 'Copyright {currentYear} by {author.name}'
  copyright: 'Copyright'

  # Author biography, shown at the top of the pages
  bio: Your bio
  # Site Description, used in HTML meat
  description: My Blog

  # Social links in footer, if you don't have it just delete it or comment it out
  # Use the list form below to preserve display order.
  # Source: https://github.com/simple-icons/simple-icons
  social:
    - name: github
      url: your-github-link
    - name: twitter
      url: your-twitter-link
    - name: stackoverflow
      url: your-stackoverflow-link
    - name: email
      url: your-email
    - name: facebook
      url: your-facebook-link
    - name: mastodon
      url: your-mastodon-link
    - name: linkedin
      url: your-linkedin-link
    # Example for custom social icon:
    # 1. preferred: create `layouts/partials/svgs/<key>.svg` to get the same fill/size behavior as built-in icons
    # 2. fallback: add `static/image/social/<key>.svg|png|jpg|jpeg|webp`
    - name: bluesky
      url: your-bluesky-link

  # Optional fallback location for custom social icons in your site's static directory.
  # If there is no matching SVG partial in layouts/partials/svgs/, the theme will try:
  # static/image/social/<key>.svg|png|jpg|jpeg|webp
  socialIconsPath: image/social

  # URL for the source code of the blog, it must point to the main/master branch such that when it's appended with
  # /content/<path-of-article> it should end up at he article source
  # ex. 'https://github.com/TopHatCroat/blog/tree/master'
  # editUrl: https://github.com/<your username>/<your repository>/tree/master

  favicon: 'image/favicon.svg'
  avatar: 'image/avatar.png'

  fonts:
    useGoogleFonts: true
    urls:
      - https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poltawski+Nowy:ital,wght@0,400..700;1,400..700&display=swap

  ###########################################
  # Optional Configuration
  ###########################################

  # To enable RSS, you could set `enableRSS: true`, default is `true`
  enableRSS: true
  # To hidden post summary in home page, you could set `hiddenPostSummaryInHomePage: true`, default is `false`
  hiddenPostSummaryInHomePage: false

  # You can put your custom css and js to `static` directory, or use remote css and js files which start with `http://` or `https://`
  customCSS:
    ## e.g.
    # - css/custom.css # local css in `static/css/custom.css`
    # - https://example.com/custom.css # remote css
    - css/custom.css

  customJS:
    ## e.g.
    # - js/custom.js # local js in `static/js/custom.js`
    # - https://example.com/custom.js # remote js
