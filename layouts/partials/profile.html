{{ $author := .Site.Params.author }}
<div id="profile">
  {{ if .Site.Params.avatar }}
    <div id="avatar">
      <img alt="avatar" src="{{ .Site.Params.avatar | relURL }}" />
    </div>
  {{ end }}

  <div id="description">
    <h1 class="title">{{ $author.name }}</h1>

    {{ with .Site.Params.Bio }}
      <h2>{{ . | markdownify }}</h2>
    {{ end }}
  </div>
</div>
